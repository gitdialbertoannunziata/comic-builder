<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comic-builder</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 5h24v17H15l-7 6v-6H4z' fill='%23ffd23f' stroke='%231c1c1a' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      /* Lo stesso file che opentype.js misura: senza questo @font-face il
         browser disegnerebbe con un font di ripiego mentre il lettering è
         calcolato su Comic Neue, e le due larghezze non coinciderebbero. */
      @font-face {
        font-family: "Comic Neue";
        src: url("/fonts/ComicNeue-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
