# Packaging lite (§12, F6): installer per macOS, Windows e Linux, senza firma
# né aggiornamenti automatici. La UI compilata (packages/ui/dist) va accanto
# all'app come risorsa: il processo principale la serve come app://ui.
appId: it.comicbuilder.app
productName: comic-builder
executableName: comic-builder
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
asar: true
# Niente aggiornamenti automatici nel packaging lite: senza un posto dove pubblicare,
# electron-builder non deve generare i file di aggiornamento (e fallirebbe cercando il canale).
publish: null
mac:
  target: dmg
  category: public.app-category.graphics-design
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Graphics
